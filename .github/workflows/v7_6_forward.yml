name: V7.6 ALL KRW Forward

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, two minutes after a 5-minute candle boundary.
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: write

concurrency:
  group: v7-6-all-krw
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync latest repository before scan
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run V7.6 ALL KRW scanner
        run: python src/v7_6_forward.py

      - name: Build live re-ignition ranking
        run: python src/live_ranker.py

      - name: Commit and push data safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/data/v7_6_signals.json \
            docs/data/v7_6_latest.json \
            docs/data/live_ranker.json \
            docs/data/v7_6_live.json \
            docs/data/v7_6_top20.json \
            docs/data/v7_6_history/ \
            docs/data/v7_6_rank_history/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "update v7.6 and live ranking"

          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 2))
          done

          echo "Push failed after 5 attempts."
          exit 1
