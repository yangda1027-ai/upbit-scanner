name: Manual V6.5 Historical Replication Backtest
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upbit-v6-5-replication-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Run V6.5 historical replication
        env:
          TRAIN_DAYS: "120"
          TEST_DAYS: "60"
          HOLDOUT_OFFSET_DAYS: "181"
          K_NEIGHBORS: "50"
          REQUEST_DELAY: "0.12"
        run: python src/backtest_replication.py
      - name: Commit result
        run: |
          git config user.name "upbit-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest_replication_latest.json docs/backtest_replication.html
          git diff --cached --quiet || git commit -m "Update V6.5 historical replication"
          git pull --rebase
          git push
