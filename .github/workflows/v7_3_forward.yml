name: V7.3 Early Signal Forward
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upbit-v7-3-early
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect V7.3 early signals
        run: python src/v7_3_forward.py
      - name: Evaluate matured V7.3 signals
        run: python src/v7_3_evaluate.py
      - name: Commit V7.3 forward log
        run: |
          git config user.name "upbit-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/v7_3_signals.json docs/data/v7_3_latest.json
          git diff --cached --quiet || git commit -m "V7.3 early forward snapshot"
          git pull --rebase
          git push
