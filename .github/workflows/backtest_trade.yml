name: Manual V6.2 Trade Backtest
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upbit-v6-2-trade-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Run V6.2 trade backtest
        env:
          TRAIN_DAYS: "120"
          TEST_DAYS: "60"
          K_NEIGHBORS: "50"
          TAKE_PROFIT_PCT: "5"
          STOP_LOSS_PCT: "3"
          MAX_HOLD_HOURS: "6"
          REQUEST_DELAY: "0.12"
        run: python src/backtest_trade.py
      - name: Commit result
        run: |
          git config user.name "upbit-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest_trade_latest.json docs/backtest_trade.html
          git diff --cached --quiet || git commit -m "Update V6.2 trade backtest"
          git pull --rebase
          git push
