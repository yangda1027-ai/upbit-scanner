name: Manual Hybrid 1-Month Backtest

on:
  workflow_dispatch:
    inputs:
      start_kst:
        description: "Start KST (YYYY-MM-DD HH:MM)"
        required: true
        default: "2026-08-15 00:00"
      end_kst:
        description: "End KST (YYYY-MM-DD HH:MM)"
        required: true
        default: "2026-09-14 23:00"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run backtest
        env:
          BT_START_KST: ${{ inputs.start_kst }}
          BT_END_KST: ${{ inputs.end_kst }}
          BT_REQUEST_DELAY: "0.12"
          BT_MAX_MARKETS: "0"
        run: python src/backtest_hybrid_month.py

      # 백테스트 결과를 먼저 Artifact로 보존
      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-month-backtest-result
          path: docs/data/hybrid_month_backtest_latest.json
          if-no-files-found: warn
          retention-days: 30

      # GitHub 저장소에도 결과를 반영
      - name: Commit result
        if: success()
        continue-on-error: true
        run: |
          git config user.name "upbit-scanner-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data/hybrid_month_backtest_latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update hybrid 1-month backtest"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i/5"

            git pull --rebase origin main || {
              echo "Rebase failed."
              git rebase --abort || true
              exit 0
            }

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Remote changed again. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          echo "Artifact was already saved, so backtest result is safe."
          exit 0
