name: V7.1 Market Risk
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: upbit-v7-1-market-risk
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Calculate V7.1 market risk
        run: python src/v7_1_market.py
      - name: Commit V7.1 market snapshots
        run: |
          git config user.name "upbit-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/v7_1_market_latest.json docs/data/v7_1_market_history.json
          git diff --cached --quiet || git commit -m "V7.1 market risk snapshot"
          git pull --rebase
          git push
