<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upbit V7 Forward Validation</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f4f6f8;margin:0;color:#111827}.w{max-width:1100px;margin:30px auto;padding:0 16px}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 1px 5px #0001}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}.muted{color:#6b7280}.pos{font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}
</style></head><body><div class="w"><h1>업비트 V7 Forward Validation</h1>
<div class="card"><b>과거 백테스트 최적화가 아니라 실제 미래 신호 기록</b><div class="muted">5분마다 당시 신호를 저장하고 1/3/6/24시간 뒤 자동 채점합니다. 아직 자동매매 신호가 아닙니다.</div><div id="meta"></div></div>
<div class="card"><h2>현재 TOP 10</h2><div style="overflow:auto"><table id="top"></table></div></div>
<div class="card"><h2>Forward 성적</h2><div id="stats" class="grid"></div></div>
<div class="card"><h2>최근 기록</h2><div style="overflow:auto"><table id="hist"></table></div></div>
</div><script>
const f=x=>x==null?'—':Number(x).toFixed(2)+'%';
Promise.all([fetch('./data/v7_latest.json?x='+Date.now()).then(r=>r.json()),fetch('./data/v7_signals.json?x='+Date.now()).then(r=>r.json())]).then(([l,h])=>{
document.getElementById('meta').innerHTML=`<p>마지막 수집: <b>${l.updated_at}</b> · BTC 15m ${f(l.btc.ret_15m)} · BTC 60m ${f(l.btc.ret_60m)}</p>`;
let t='<tr><th>종목</th><th>Score</th><th>5m</th><th>15m</th><th>60m</th><th>거래대금가속</th></tr>';
for(const x of l.top)t+=`<tr><td>${x.market}</td><td><b>${x.score}</b></td><td>${f(x.ret_5m)}</td><td>${f(x.ret_15m)}</td><td>${f(x.ret_60m)}</td><td>${x.value_accel_15m}</td></tr>`;document.getElementById('top').innerHTML=t;
for(const [key,label] of [['h1','1시간'],['h3','3시간'],['h6','6시간'],['h24','24시간']]){
 let a=h.filter(x=>x[key]); let hit=a.filter(x=>x[key].hit_5).length; let avg=a.length?a.reduce((s,x)=>s+x[key].close_pct,0)/a.length:0;
 document.getElementById('stats').innerHTML+=`<div class="card"><b>${label}</b><p>채점 ${a.length}건</p><p>+5% 터치 ${a.length?(hit/a.length*100).toFixed(1):'—'}%</p><p>평균 종가수익 ${a.length?avg.toFixed(3):'—'}%</p></div>`;
}
let recent=h.slice(-100).reverse();let z='<tr><th>시간</th><th>종목</th><th>점수</th><th>1h</th><th>3h</th><th>6h</th><th>24h</th></tr>';
for(const x of recent)z+=`<tr><td>${x.ts.slice(5,16).replace('T',' ')}</td><td>${x.market}</td><td>${x.score}</td><td>${x.h1?f(x.h1.close_pct):'—'}</td><td>${x.h3?f(x.h3.close_pct):'—'}</td><td>${x.h6?f(x.h6.close_pct):'—'}</td><td>${x.h24?f(x.h24.close_pct):'—'}</td></tr>`;document.getElementById('hist').innerHTML=z;
}).catch(e=>document.getElementById('meta').textContent='데이터가 아직 없습니다: '+e);
</script></body></html>
