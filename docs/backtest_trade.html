<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6.2 Trade Backtest</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111827}.w{max-width:1050px;margin:auto}.c{background:white;border-radius:16px;padding:15px;margin:12px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}.warn{background:#fff7ed;color:#9a3412}</style></head><body><div class="w"><h1>업비트 V6.2 실전매매 백테스트</h1><div id="m" class="c">불러오는 중…</div><div id="t"></div><div id="r"></div><div class="c warn">수수료·슬리피지는 미반영. 같은 5분봉에서 익절과 손절이 모두 닿으면 보수적으로 손절 우선.</div></div><script>async function load(){try{let d=await(await fetch("data/backtest_trade_latest.json?t="+Date.now(),{cache:"no-store"})).json(),c=d.config||{};m.innerHTML=`<b>${d.version}</b> · 학습 ${c.train_days}일 / 검증 ${c.test_days}일 · +${c.tp}% 익절 / -${c.sl}% 손절 / ${c.hold_hours}h 보유`;let rows=Object.entries(d.threshold_trade_stats||{}).map(([k,x])=>`<tr><td>${k}점+</td><td>${x.n}</td><td>${x.tp_rate}%</td><td>${x.sl_rate}%</td><td>${x.time_rate}%</td><td><b>${x.avg_return}%</b></td><td>${x.profit_factor}</td><td>${x.same_candle_conflicts}</td></tr>`).join("");t.innerHTML=`<div class="c"><h2>B형 점수별 실제 매매</h2><table><tr><th>점수</th><th>거래수</th><th>익절률</th><th>손절률</th><th>시간종료</th><th>평균수익</th><th>Profit Factor</th><th>동시터치</th></tr>${rows}</table></div>`;let rr=Object.entries(d.surge_recall||{}).map(([k,x])=>`<tr><td>+${k}%</td><td>${x.events}</td><td>${x.detected_1h_pct}%</td><td>${x.detected_3h_pct}%</td><td>${x.detected_6h_pct}%</td></tr>`).join("");r.innerHTML=`<div class="c"><h2>실제 급등 사전 포착률 · B형 75점+</h2><table><tr><th>급등폭</th><th>사건수</th><th>1h 전</th><th>3h 전</th><th>6h 전</th></tr>${rr}</table></div>`}catch(e){m.textContent="아직 결과 없음" }}load();</script></body></html>
