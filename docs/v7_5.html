<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V7.5 Phoenix Tournament</title>
<style>
:root{
  --bg:#0b0f14; --card:#121923; --line:#263241; --text:#edf2f7; --muted:#97a6b5;
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  max-width:1150px;margin:auto;padding:18px;background:var(--bg);color:var(--text)
}
h1{font-size:25px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:15px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px}
.good{font-weight:750}
.tag{
  display:inline-block;border:1px solid #3a4a5e;border-radius:999px;
  padding:4px 8px;font-size:12px;margin:3px
}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{
  padding:8px 5px;border-bottom:1px solid #24303d;text-align:right;
  vertical-align:middle
}
th:first-child,td:first-child{text-align:left}
.section{margin-top:20px}
.leader{border-width:2px}
.warn{
  font-size:12px;padding:10px;border:1px solid #3a4a5e;
  border-radius:12px;margin-top:10px
}
.stale{font-weight:700}
.table-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
#candidateTable{
  min-width:980px;
}
.time-col{
  min-width:175px;
  width:175px;
  white-space:nowrap;
  text-align:center!important;
}
.market-col{min-width:70px}
.status-col{min-width:90px}
.abc-hit{
  font-weight:800;
  border:1px solid #5b6f8a;
  border-radius:999px;
  padding:2px 7px;
  display:inline-block;
}
.abc-card{
  margin-top:20px;
  border:1px solid #36506d;
}
.abc-metrics{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:12px;
}
.metric{
  text-align:center;
  padding:10px 6px;
  border-right:1px solid #263241;
}
.metric:last-child{border-right:0}
.metric .n{font-size:22px;font-weight:800;margin-top:4px}
@media(max-width:560px){
  .abc-metrics{grid-template-columns:1fr 1fr}
  .metric{border-right:0;border-bottom:1px solid #263241}
}
</style>
</head>
<body>

<h1>&#x1F525; V7.5 Project Phoenix &#8212; Forward Tournament</h1>

<div class="muted">
V7.3&#51008; &#44536;&#45824;&#47196; &#50976;&#51648; &#183;
A/B/C &#49464; &#51204;&#47029;&#51012; &#46041;&#49884;&#50640; &#44256;&#51221; &#183;
5&#48516;&#47560;&#45796; &#51088;&#46041; &#44081;&#49888;
</div>

<div id="meta" class="warn"></div>
<div id="cards" class="grid"></div>

<div class="card abc-card">
  <div style="font-size:19px;font-weight:800">
    ABC &#46041;&#49884; &#52649;&#51313; (A+B+C)
  </div>
  <div class="muted" style="margin-top:5px">
    A, B, C &#49464; &#51204;&#47029; &#51312;&#44148;&#51012; &#47784;&#46160; &#47564;&#51313;&#54620; &#44221;&#50864;&#47564; &#48324;&#46020; &#51665;&#44228;
  </div>

  <div class="abc-metrics">
    <div class="metric">
      <div class="muted">&#44277;&#49885; &#54364;&#48376;</div>
      <div id="abcEpisodes" class="n">-</div>
    </div>
    <div class="metric">
      <div class="muted">Sleeper &#54217;&#44032;</div>
      <div id="abcSleepers" class="n">-</div>
    </div>
    <div class="metric">
      <div class="muted">+3%</div>
      <div id="abc3" class="n">-</div>
    </div>
    <div class="metric">
      <div class="muted">+5%</div>
      <div id="abc5" class="n">-</div>
    </div>
    <div class="metric">
      <div class="muted">+10%</div>
      <div id="abc10" class="n">-</div>
    </div>
  </div>
</div>

<div class="section card">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
    <b style="font-size:18px">&#52572;&#44540; Phoenix &#54980;&#48372;</b>
    <span id="candidateCount" class="muted"></span>
  </div>

  <div class="table-wrap">
    <table id="candidateTable">
      <thead>
        <tr>
          <th>&#51204;&#47029;</th>
          <th class="market-col">&#53076;&#51064;</th>
          <th class="time-col">&#49884;&#44033; (KST)</th>
          <th class="status-col">&#49345;&#53468;</th>
          <th>SCORE</th>
          <th>5m</th>
          <th>15m &#44032;&#49549;</th>
          <th>30m &#44032;&#49549;</th>
          <th>6h MAX</th>
          <th>h24 MAX</th>
          <th>ABC</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const REFRESH_MS = 5 * 60 * 1000;

const KO = {
  lastUpdate: "\ub9c8\uc9c0\ub9c9 \uc5c5\ub370\uc774\ud2b8",
  forwardStart: "\uacf5\uc2dd Forward \uc2dc\uc791",
  leaderRule: "\ub9ac\ub354 \uc120\uc815 \ucd5c\uc18c \uc870\uac74",
  leader: "\ud604\uc7ac \ub9ac\ub354",
  none: "\uc544\uc9c1 \uc5c6\uc74c",
  nextRefresh: "\ud398\uc774\uc9c0 \uc790\ub3d9 \uc0c8\ub85c\uace0\uce68",
  stale: "\u26a0 \ub370\uc774\ud130\uac00 10\ubd84 \uc774\uc0c1 \uc5c5\ub370\uc774\ud2b8\ub418\uc9c0 \uc54a\uc558\uc74c",
  h24: "\u203b h24\ub294 V7.3 evaluator\uac00 \uae30\ub85d\ud55c \uae30\uc874 \uc815\uc758\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9.",
  strategy: "\uc804\ub7b5",
  officialForward: "\uacf5\uc2dd Forward",
  historical: "\uacfc\uac70 \ucc38\uace0(In-sample)",
  sleeperEval: "Sleeper \ud3c9\uac00"
};

function fmt(v, suffix=''){
  return v===null || v===undefined || Number.isNaN(v)
    ? '-'
    : (typeof v==='number' ? v.toFixed(2)+suffix : v+suffix);
}

function ageMinutes(iso){
  if(!iso) return null;
  const t = new Date(iso).getTime();
  if(Number.isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 60000);
}

function compactKst(s){
  if(!s) return '-';
  return s.replace(' KST','');
}

function statsBlock(title,s){
  return `
    <div class="muted" style="margin-top:10px">${title}</div>
    <table>
      <tr><td>Episodes</td><td>${s.episodes}</td></tr>
      <tr><td>6h FAST</td><td>${fmt(s.fast_move_rate_pct,'%')} (${s.fast_move_n}/${s.h6_matured})</td></tr>
      <tr><td>${KO.sleeperEval}</td><td>${s.sleeper_evaluated_n}</td></tr>
      <tr><td>Sleeper +3%</td><td>${fmt(s.sleeper_hit3_pct,'%')}</td></tr>
      <tr><td>Sleeper +5%</td><td>${fmt(s.sleeper_hit5_pct,'%')}</td></tr>
      <tr><td>Sleeper +10%</td><td>${fmt(s.sleeper_hit10_pct,'%')}</td></tr>
    </table>`;
}

async function load(){
  const r = await fetch('./data/v7_5_tournament.json?ts='+Date.now(), {
    cache: 'no-store'
  });

  const d = await r.json();
  const m = d.meta;
  const age = ageMinutes(m.generated_at_utc);

  const staleText = (age !== null && age >= 10)
    ? `<br><span class="stale">${KO.stale} (${age}\ubd84)</span>`
    : '';

  document.getElementById('meta').innerHTML =
    `${KO.lastUpdate}: <b>${m.generated_at_kst || '-'}</b><br>` +
    `${KO.forwardStart}: <b>${m.forward_start_kst || '-'}</b><br>` +
    `${KO.leaderRule}: ${m.leader_rule || '-'}<br>` +
    `${KO.leader}: <b>${m.leader ?? KO.none}</b><br>` +
    `${KO.nextRefresh}: <b>5\ubd84</b><br>` +
    `<span class="muted">${KO.h24}</span>` +
    staleText;

  const ids = ['A','B','C'];

  document.getElementById('cards').innerHTML = ids.map(id => {
    const x = d.strategies[id];
    const lead = m.leader === id ? ' leader' : '';

    return `<div class="card${lead}">
      <div>
        <span class="tag">${KO.strategy} ${id}</span>
        ${m.leader===id ? '<span class="tag">LEADER</span>' : ''}
      </div>
      <div style="font-size:18px;font-weight:750;margin-top:8px">${x.name}</div>
      <div class="muted">${x.description}</div>
      ${statsBlock(KO.officialForward, x.official_forward)}
      ${statsBlock(KO.historical, x.historical_in_sample)}
    </div>`;
  }).join('');

  const abc = d.abc_overlap?.official_forward || {};
  document.getElementById('abcEpisodes').textContent = abc.episodes ?? 0;
  document.getElementById('abcSleepers').textContent = abc.sleeper_evaluated_n ?? 0;
  document.getElementById('abc3').textContent = fmt(abc.sleeper_hit3_pct,'%');
  document.getElementById('abc5').textContent = fmt(abc.sleeper_hit5_pct,'%');
  document.getElementById('abc10').textContent = fmt(abc.sleeper_hit10_pct,'%');

  const sigs = (d.signals || []).slice(0,50);
  document.getElementById('candidateCount').textContent =
    `\ucd1d ${sigs.length}\uac1c (\ucd5c\uadfc 50\uac1c\ub9cc \ud45c\uc2dc)`;

  document.getElementById('rows').innerHTML = sigs.map(x => {
    const h6 = x.h6?.max_pct;
    const h24 = x.h24?.max_pct;
    const abcMark = x.abc_all ? '<span class="abc-hit">ALL</span>' : '-';

    return `<tr>
      <td>${x.strategy}</td>
      <td>${x.market?.replace('KRW-','')}</td>
      <td class="time-col">${compactKst(x.ts_kst)}</td>
      <td class="${String(x.status).startsWith('PHOENIX')?'good':''}">
        ${x.status}
      </td>
      <td>${fmt(Number(x.score))}</td>
      <td>${fmt(Number(x.ret_5m),'%')}</td>
      <td>${fmt(Number(x.value_accel_15m),'x')}</td>
      <td>${fmt(Number(x.value_accel_30m),'x')}</td>
      <td>${fmt(h6,'%')}</td>
      <td>${fmt(h24,'%')}</td>
      <td>${abcMark}</td>
    </tr>`;
  }).join('');
}

load().catch(e => {
  document.getElementById('meta').innerHTML =
    `<span class="stale">LOAD ERROR: ${e}</span>`;
});

setInterval(() => {
  load().catch(()=>{});
}, REFRESH_MS);
</script>
</body>
</html>
