<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V7.1 Market Risk</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f4f6f8;margin:0;color:#111827}.w{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 1px 5px #0001}.big{font-size:42px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.k{font-size:13px;color:#6b7280}.v{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse}td{padding:9px;border-bottom:1px solid #e5e7eb}.muted{color:#6b7280}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="w"><h1>업비트 V7.1 Market Risk</h1><div class="card"><b>BTC 방향 예측기가 아니라 알트 매매 안전장치</b><p class="muted">BTC가 조금 하락해도 알트 breadth와 거래대금 확산이 버티면 GREEN이 될 수 있습니다. V7 Score와 Market Risk는 분리되어 있습니다.</p><div id="main"></div></div><div class="grid" id="grid"></div><div class="card"><h2>위험 사유</h2><div id="reasons"></div></div><div class="card"><h2>현재 V7 TOP 10 + Market Risk</h2><div style="overflow:auto"><table id="top"></table></div></div></div>
<script>const f=x=>x==null?'—':Number(x).toFixed(2)+'%';Promise.all([fetch('./data/v7_1_market_latest.json?x='+Date.now()).then(r=>r.json()),fetch('./data/v7_latest.json?x='+Date.now()).then(r=>r.json())]).then(([m,v7])=>{document.getElementById('main').innerHTML=`<div class="big">${m.state} · Risk ${m.risk}/100</div><p>마지막 계산 ${m.ts}</p>`;const items=[['BTC 5m',f(m.btc.ret5)],['BTC 15m',f(m.btc.ret15)],['BTC 60m',f(m.btc.ret60)],['알트 15m 상승비율',m.breadth15+'%'],['알트 60m 상승비율',m.breadth60+'%'],['알트 중앙값 15m',f(m.median15)],['15m -2% 이하 비율',m.crash15_share+'%'],['거래대금 확산',m.value_diffusion+'%'],['샘플',m.sample_size+'종목']];for(const [k,val] of items)document.getElementById('grid').innerHTML+=`<div class="card"><div class="k">${k}</div><div class="v">${val}</div></div>`;document.getElementById('reasons').innerHTML=m.reasons.length?m.reasons.map(x=>`<p>• ${x}</p>`).join(''):'<p>특별한 위험 신호 없음</p>';let t='<tr><td><b>종목</b></td><td><b>V7 Score</b></td><td><b>15m</b></td><td><b>60m</b></td><td><b>시장</b></td></tr>';for(const x of v7.top)t+=`<tr><td>${x.market}</td><td>${x.score}</td><td>${f(x.ret_15m)}</td><td>${f(x.ret_60m)}</td><td>${m.state} ${m.risk}</td></tr>`;document.getElementById('top').innerHTML=t;}).catch(e=>document.getElementById('main').textContent='데이터가 아직 없습니다: '+e);</script></body></html>
