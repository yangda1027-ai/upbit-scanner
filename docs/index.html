<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upbit Scanner V6</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:14px;color:#111827}.w{max-width:980px;margin:auto}.bar,.live,.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0}.bar{background:#ecfeff}.live{background:#ecfdf5}.row{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.m{background:#f9fafb;padding:8px;border-radius:10px}.m small{display:block;color:#6b7280}.mut{color:#6b7280;font-size:13px}.score{font-size:24px;font-weight:800}.pill{display:inline-block;background:#eef2ff;border-radius:99px;padding:4px 8px;margin:4px 3px 0 0;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="w"><h1>업비트 급등 스캐너 V6</h1><div class="mut">A형 급등 전 잠복형 + B형 재급등/모멘텀형</div><div id="market" class="bar"></div><div id="live" class="live"></div><div id="A"></div><div id="B"></div></div>
<script>
const M=(l,v,s="")=>`<div class="m"><small>${l}</small><b>${v??"-"}${s}</b></div>`;
function sec(title,sub,arr){return `<h2>${title}</h2><div class="mut">${sub}</div>${(arr||[]).map((x,i)=>`<div class="card"><div class="row"><div><b>${i+1}. ${x.name}</b><div class="mut">${x.market}${x.recent_big_pump?" · 최근 급등 이력":""}</div></div><div class="score">${x.score}</div></div><div class="grid">${M("현재가",Number(x.price).toLocaleString("ko-KR"),"원")}${M("유사 +5%",x.hist_p5,"%")}${M("5분 거래대금",x.vol5,"x")}${M("15분 거래대금",x.vol15,"x")}${M("1h",x.ret1h,"%")}${M("3h",x.ret3h,"%")}${M("6h",x.ret6h,"%")}${M("24h 고점 거리",x.dist_24h_high,"%")}${M("RSI 1h",x.rsi1h)}${M("30일 최대급등",x.max_30d_pump_pct,"%")}</div><div>${(x.why||[]).map(v=>`<span class="pill">${v}</span>`).join("")}</div></div>`).join("")}`}
async function load(){let d=await(await fetch("data/latest.json?t="+Date.now(),{cache:"no-store"})).json(),b=d.btc_regime||{},lv=d.live_validation||{};document.getElementById("market").innerHTML=`BTC 시장상태 <b>${b.score}/4</b> · 6h ${b.ret6}% · 24h ${b.ret24}% · RSI ${b.rsi1h}`;let a=lv.latent?.["6"],m=lv.momentum?.["6"];document.getElementById("live").innerHTML=`<b>실전 6h 검증</b> · A형 ${a?.samples||0}건 / +5% ${a?.p5??"-"}% · B형 ${m?.samples||0}건 / +5% ${m?.p5??"-"}%`;document.getElementById("A").innerHTML=sec("A형 · 급등 전 잠복형","최근 20% 이상 급등 이력 없는 후보",d.latent_results);document.getElementById("B").innerHTML=sec("B형 · 재급등/모멘텀형","최근 급등 이력이 있어도 거래대금 재확대와 고점 재접근을 포착",d.momentum_results)}load();
</script></body></html>
