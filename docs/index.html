<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Upbit Scanner V6.1</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
body{margin:0;padding:14px}.w{max-width:1080px;margin:auto}h1{margin:8px 0 3px;font-size:28px}h2{margin:22px 0 4px;font-size:21px}.mut{color:#6b7280;font-size:13px}.bar,.live,.status,.card,.warn{border-radius:16px;padding:14px;margin:10px 0}.bar{background:#ecfeff}.live{background:#ecfdf5}.status{background:#fff}.card{background:#fff;box-shadow:0 1px 4px #0001}.warn{background:#fff7ed;color:#9a3412;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.rank{font-size:22px;font-weight:800;width:34px}.coin{flex:1}.coin b{font-size:18px}.score{font-size:27px;font-weight:800;text-align:right}.score small{display:block;font-size:11px;color:#6b7280}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.m{background:#f9fafb;border-radius:12px;padding:9px}.m small{display:block;color:#6b7280;font-size:12px;margin-bottom:3px}.m b{font-size:15px}.pill{display:inline-block;background:#eef2ff;border-radius:99px;padding:4px 8px;margin:5px 3px 0 0;font-size:12px}.livegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}.livebox{background:white;border-radius:11px;padding:9px}.livebox small{display:block;color:#6b7280;font-size:11px}.livebox b{font-size:14px}button{background:#111827;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.livegrid{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}}
</style>
</head>
<body>
<div class="w">
<h1>업비트 급등 스캐너 V6.1</h1>
<div class="mut">A형 급등 전 잠복형 + B형 재급등/모멘텀형 · 상세지표 복구판</div>
<div id="market" class="bar">불러오는 중…</div>
<div id="live" class="live"></div>
<div class="status row"><div id="st" class="mut">상태 불러오는 중…</div><button onclick="load()">화면 새로고침</button></div>
<div id="latent"></div><div id="momentum"></div>
<div class="warn">A형은 최근 큰 급등 없이 거래대금·압축·유사패턴이 먼저 나타나는 후보입니다. B형은 최근 급등 이력이 있어도 거래대금 재확대와 고점 재접근이 나타나는 2차·3차 상승 후보를 찾습니다. 표시 점수는 상승확률이 아닙니다.</div>
</div>
<script>
const M=(label,value,suffix="")=>`<div class="m"><small>${label}</small><b>${value===undefined||value===null?"-":value}${value===undefined||value===null?"":suffix}</b></div>`;
function fmtPrice(v){if(v===undefined||v===null)return "-";return Number(v).toLocaleString("ko-KR")}
function liveBox(label,x){if(!x||!x.samples)return `<div class="livebox"><small>${label}</small><b>표본 대기중</b></div>`;return `<div class="livebox"><small>${label} · ${x.samples}건</small><b>+5% ${x.p5}%</b><div class="mut">+3 ${x.p3}% · +10 ${x.p10}%</div><div class="mut">평균최대 ${x.avg_max_gain}% · DD ${x.avg_max_drawdown}%</div></div>`}
function card(x,i){return `<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="coin"><b>${x.name}</b><div class="mut">${x.market}${x.recent_big_pump?" · 최근 급등 이력":""}</div></div><div class="score">${x.score}<small>/100</small></div></div><div class="grid">${M("현재가",fmtPrice(x.price),"원")}${M("패턴 유사도",x.similarity,"%")} ${M("60일 유사 +3%",x.hist_p3,"%")} ${M("60일 유사 +5%",x.hist_p5,"%")} ${M("60일 유사 +10%",x.hist_p10,"%")} ${M("유사패턴 평균 6h",x.hist_avg_gain6h,"%")} ${M("5분 거래대금",x.vol5,"x")} ${M("15분 거래대금",x.vol15,"x")} ${M("1시간 거래대금",x.vol1h,"x")} ${M("4시간 거래대금",x.vol4h,"x")} ${M("RSI 15m",x.rsi15)} ${M("RSI 1h",x.rsi1h)} ${M("RSI 4h",x.rsi4h)} ${M("1h 등락",x.ret1h,"%")} ${M("3h 등락",x.ret3h,"%")} ${M("6h 등락",x.ret6h,"%")} ${M("24h 등락",x.ret24h,"%")} ${M("24h 고점 거리",x.dist_24h_high,"%")} ${M("1h 돌파거리",x.breakout,"%")} ${M("EMA 갭",x.ema_gap,"%")} ${M("가격 위치",x.range_pos,"%")} ${M("30일 최대급등",x.max_30d_pump_pct,"%")}</div><div>${(x.why||[]).map(v=>`<span class="pill">${v}</span>`).join("")}</div></div>`}
function section(title,sub,arr){return `<section><h2>${title}</h2><div class="mut">${sub}</div>${(arr||[]).map(card).join("")||`<div class="card">후보 없음</div>`}</section>`}
async function load(){try{const d=await(await fetch("data/latest.json?t="+Date.now(),{cache:"no-store"})).json();const b=d.btc_regime||{},lv=d.live_validation||{};document.getElementById("market").innerHTML=`BTC 시장상태 <b>${b.score??"-"}/4</b> · 6h ${b.ret6??"-"}% · 24h ${b.ret24??"-"}% · RSI(1h) ${b.rsi1h??"-"}`;document.getElementById("live").innerHTML=`<b>실전 누적검증</b><div class="livegrid">${liveBox("A형 1h",lv.latent?.["1"])}${liveBox("A형 3h",lv.latent?.["3"])}${liveBox("A형 6h",lv.latent?.["6"])}${liveBox("A형 12h",lv.latent?.["12"])}${liveBox("A형 24h",lv.latent?.["24"])}${liveBox("B형 1h",lv.momentum?.["1"])}${liveBox("B형 3h",lv.momentum?.["3"])}${liveBox("B형 6h",lv.momentum?.["6"])}${liveBox("B형 12h",lv.momentum?.["12"])}${liveBox("B형 24h",lv.momentum?.["24"])}</div>`;const generated=d.generated_at_utc?new Date(d.generated_at_utc).toLocaleString("ko-KR"):"-";const markets=d.config?.markets??"-",examples=d.config?.historical_examples??"-",sig=d.signal_history_count??"-";document.getElementById("st").textContent=`마지막 분석 ${generated} · 누적 신호 ${sig}건 · 분석 후보 ${markets}개 · 학습 예제 ${examples}개`;document.getElementById("latent").innerHTML=section("A형 · 급등 전 잠복형","최근 큰 급등 없이 거래대금·압축·유사패턴이 먼저 나타나는 후보",d.latent_results);document.getElementById("momentum").innerHTML=section("B형 · 재급등/모멘텀형","최근 급등 이력이 있어도 거래대금 재확대·고점 재접근·추세 유지가 나타나는 후보",d.momentum_results)}catch(e){document.getElementById("st").textContent="데이터 로딩 실패 · GitHub Actions/Pages 상태 확인";console.error(e)}}
load();
</script>
</body>
</html>
