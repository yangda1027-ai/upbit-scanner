<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Upbit Scanner V5</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}body{margin:0;padding:14px}.w{max-width:980px;margin:auto}h1{margin:10px 0 3px;font-size:27px}.mut{color:#6b7280;font-size:13px}.bar,.bt,.live{padding:12px;border-radius:14px;margin:10px 0}.bar{background:#ecfeff}.bt{background:#f5f3ff}.live{background:#ecfdf5}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.card{background:#fff;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 1px 4px #0001}.rank{font-size:22px;font-weight:800;width:34px}.coin{flex:1}.coin b{font-size:18px}.score{font-size:25px;font-weight:800;text-align:right}.score small{display:block;font-size:11px;color:#6b7280}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.m{background:#f9fafb;border-radius:12px;padding:8px}.m small{display:block;color:#6b7280}.pill{display:inline-block;background:#eef2ff;border-radius:99px;padding:4px 8px;margin:4px 3px 0 0;font-size:12px}button{background:#111827;color:#fff;border:0;border-radius:12px;padding:10px 13px;font-weight:700}.warn{font-size:12px;color:#9a3412;background:#fff7ed;padding:12px;border-radius:14px;margin:12px 0}.livegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.livebox{background:#fff;border-radius:10px;padding:8px}.livebox b{display:block;font-size:16px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.livegrid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="w"><h1>업비트 급등 전 패턴 스캐너 V5</h1><div class="mut">60일 학습 + 매시간 실전 추천 기록 + 1/3/6/12/24시간 실제 성과 추적</div>
<div id="market" class="bar">불러오는 중…</div><div id="bt" class="bt"></div><div id="live" class="live"></div>
<div class="row"><div id="st" class="mut"></div><button onclick="load()">화면 새로고침</button></div><div id="list"></div>
<div class="warn">V5 실전검증은 추천 이후 실제 가격을 추적한 기록입니다. 첫날에는 12h/24h 표본이 없거나 매우 적은 것이 정상입니다. 급등준비점수는 상승확률이 아닙니다.</div></div>
<script>
const M=(l,v,s="")=>`<div class="m"><small>${l}</small><b>${v??"-"}${s}</b></div>`;
function LB(h,x){if(!x||!x.samples)return `<div class="livebox"><small>${h}h</small><b>표본 대기중</b></div>`;let strong=x.strong_samples?`<br>강신호 +5% ${x.strong_p5}% (${x.strong_samples}건)`:'';return `<div class="livebox"><small>${h}h · ${x.samples}건</small><b>+5% ${x.p5}%</b><span class="mut">+3% ${x.p3}% · +10% ${x.p10}%<br>평균최대 ${x.avg_max_gain}% · 평균DD ${x.avg_max_drawdown}%${strong}</span></div>`}
async function load(){try{let d=await(await fetch("data/latest.json?t="+Date.now(),{cache:"no-store"})).json(),b=d.btc_regime||{},q=d.backtest||{},lv=d.live_validation||{};document.getElementById("market").innerHTML=`BTC 시장상태 <b>${b.score}/4</b> · 6h ${b.ret6}% · 24h ${b.ret24}% · RSI(1h) ${b.rsi1h}`;document.getElementById("bt").innerHTML=`<b>과거 진단 백테스트</b> · 일반 +5% ${q.base_p5??"-"}% → 상위 신호 +5% ${q.signal_p5??"-"}% · 테스트 ${q.test_samples??"-"}개`;document.getElementById("live").innerHTML=`<b>실전 누적검증</b><div class="livegrid">${[1,3,6,12,24].map(h=>LB(h,lv[String(h)])).join("")}</div>`;document.getElementById("st").textContent=`마지막 분석 ${new Date(d.generated_at_utc).toLocaleString("ko-KR")} · 누적 신호 ${d.signal_history_count??0}건 · 후보 ${d.config.current_candidates}개`;document.getElementById("list").innerHTML=d.results.map((x,i)=>`<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="coin"><b>${x.name}</b><div class="mut">${x.market}${x.early_volume_signal?" · 거래대금 선행 감지":""}</div></div><div class="score">${x.score}<small>급등준비점수 /100</small></div></div><div class="grid">${M("현재가",Number(x.price).toLocaleString("ko-KR"),"원")}${M("패턴 유사도",x.similarity,"%")}${M("60일 유사 +3%",x.hist_p3,"%")}${M("60일 유사 +5%",x.hist_p5,"%")}${M("60일 유사 +10%",x.hist_p10,"%")}${M("5분 거래대금",x.vol5,"x")}${M("15분 거래대금",x.vol15,"x")}${M("1시간 거래대금",x.vol1h,"x")}${M("4시간 거래대금",x.vol4h,"x")}${M("RSI 15m",x.rsi15)}${M("RSI 1h",x.rsi1h)}${M("RSI 4h",x.rsi4h)}${M("1h 등락",x.ret1h,"%")}${M("6h 등락",x.ret6h,"%")}${M("30일 최대급등",x.max_30d_pump_pct,"%")}${M("유사 평균 6h",x.hist_avg_gain6h,"%")}</div><div>${x.why.map(v=>`<span class="pill">${v}</span>`).join("")}</div></div>`).join("")}catch(e){document.getElementById("st").textContent="결과 로딩 실패: Actions를 확인하세요";console.error(e)}}load();
</script></body></html>
